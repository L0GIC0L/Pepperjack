name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"

jobs:
  ngspice:
    name: ngspice for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore ngspice build
        id: cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: ngspice-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-ngspice-android.sh') }}

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cross-compile ngspice
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-ngspice-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ngspice-jnilibs
          path: app/src/main/jniLibs
          if-no-files-found: error
          retention-days: 7

  netlists:
    name: Example netlists simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install ngspice and Android SDK parts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ngspice
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.31.6" "platforms;android-37.0" > /dev/null
      - name: Export example netlists
        run: ./gradlew --stacktrace testDebugUnitTest --tests '*ExampleNetlistExport*'
        env:
          PEPPERJACK_EXPORT_DIR: ${{ runner.temp }}/netlists
      - name: Run every example through ngspice
        run: scripts/check-netlists.sh "${{ runner.temp }}/netlists"

  app:
    name: Android app
    needs: ngspice
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.PEPPERJACK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ngspice-jnilibs
          path: app/src/main/jniLibs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.31.6" "platforms;android-37.0" > /dev/null

      - name: Unit tests and lint
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PEPPERJACK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PEPPERJACK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          PEPPERJACK_KEYSTORE_PASSWORD: ${{ secrets.PEPPERJACK_KEYSTORE_PASSWORD }}
          PEPPERJACK_KEY_ALIAS: ${{ secrets.PEPPERJACK_KEY_ALIAS }}
          PEPPERJACK_KEY_PASSWORD: ${{ secrets.PEPPERJACK_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleDebug assembleRelease

      - name: Check the simulator is packaged
        run: |
          for abi in arm64-v8a x86_64; do
            unzip -l app/build/outputs/apk/release/app-release.apk | grep -q "lib/$abi/libngspice.so" \
              || { echo "libngspice.so missing for $abi"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pepperjack-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
